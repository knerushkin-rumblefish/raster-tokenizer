[package]
name = "tokenizer"
version = "0.1.0"
edition = "2021"
default-run = "tokenizer"

[[bin]]
name = "generate_input_artifacts"
path = "bin/generate_input_artifacts.rs"
required-features = ["encode"]

[features]
default = ["std"]
std = ["raster/std"]
profiling = ["raster/profiling"]
encode = ["dep:serde_json", "dep:sha2"]

[dependencies]
anyhow = "1.0"


raster = { path = "../raster/crates/raster", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", optional = true }
sha2 = { version = "0.10", optional = true }
